[build-system]
requires = ["setuptools==65.5.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pykan"
version = "0.2.8.1a0"
description = "random-logic unofficial Kolmogorov-Arnold Network package"
readme = "README.md"
requires-python = ">=3.9.7,<3.12"
dependencies = [
    "matplotlib>=3.6.2,<4",
    "numpy==1.24.4",
    "scikit-learn>=1.1.3,<1.4",
    "sympy>=1.11.1,<2",
    "torch>=2.2.2",
    "tqdm>=4.66.2",
    "pandas>=2.0.1,<3",
    "seaborn",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kan*"]
